# =============================================================================
#  Calibi AI — deploy to MilesWeb
#
#  Push to `main` (or run manually from the Actions tab) and this workflow:
#    1. builds the TanStack Start app (nitro → .output/)
#    2. ships the build to your MilesWeb server over SSH
#    3. installs production deps and (re)starts the app with PM2
#
#  One-time setup + secrets: see DEPLOY.md
# =============================================================================
name: Deploy to MilesWeb

on:
  push:
    branches: [main]
  # Manual trigger: GitHub → Actions → "Deploy to MilesWeb" → Run workflow
  # (lets you pick any branch to deploy for testing)
  workflow_dispatch:

# Never run two deploys at the same time; queue them instead.
concurrency:
  group: milesweb-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Build config
  NODE_VERSION: "22"
  # Server config — override via repo Variables (Settings → Secrets and variables
  # → Actions → Variables) if your setup differs:
  #   REMOTE_DIR : where the app lives on the server (default: ~/calibiai)
  #   APP_PORT   : port the production app listens on (default: 3000)
  #   RESTART_CMD: optional — custom command (run in REMOTE_DIR) that replaces
  #                 the built-in PM2 start/restart (e.g. cPanel Node.js manager)
  REMOTE_DIR: ${{ vars.REMOTE_DIR || '~/calibiai' }}
  APP_PORT: ${{ vars.APP_PORT || '3000' }}

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (TanStack Start / Nitro)
        run: npm run build

      - name: Sanity check build output
        run: test -f .output/server/index.mjs && echo "Build OK — .output/server/index.mjs present"

      - name: Package build
        run: |
          tar czf calibiai-build.tgz \
            .output \
            package.json \
            package-lock.json \
            ecosystem.config.cjs
          ls -lh calibiai-build.tgz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibiai-build
          path: calibiai-build.tgz
          retention-days: 1

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to MilesWeb
    runs-on: ubuntu-latest
    needs: build
    environment: production
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: calibiai-build

      - name: Validate secrets
        run: |
          missing=()
          [ -z "$SSH_HOST" ] && missing+=("SSH_HOST")
          [ -z "$SSH_USER" ] && missing+=("SSH_USER")
          if [ -z "$SSH_PRIVATE_KEY" ] && [ -z "$SSH_PASSWORD" ]; then
            missing+=("SSH_PRIVATE_KEY or SSH_PASSWORD")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub secrets: ${missing[*]}"
            echo "Add them under: repo Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "SSH target: $SSH_USER@$SSH_HOST (port $SSH_PORT)"

      - name: Upload build to server
        run: |
          set -euo pipefail
          SSH_OPTS="-P $SSH_PORT -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > deploy_key
            chmod 600 deploy_key
            scp $SSH_OPTS -i deploy_key calibiai-build.tgz "$SSH_USER@$SSH_HOST:~/calibiai-build.tgz"
          else
            export SSHPASS="$SSH_PASSWORD"
            sshpass -e scp $SSH_OPTS calibiai-build.tgz "$SSH_USER@$SSH_HOST:~/calibiai-build.tgz"
          fi
          echo "Upload complete."

      # The script that runs ON THE SERVER. Written to a file first so it can
      # be piped to `bash -s` in either auth branch.
      - name: Prepare remote deployment script
        run: |
          cat > deploy-remote.sh <<'REMOTE'
          set -euo pipefail
          REMOTE_DIR="$1"; APP_PORT="$2"; RESTART_CMD="$3"

          # Resolve ~ to the real home directory.
          case "$REMOTE_DIR" in
            "~") APP_DIR="$HOME" ;;
            "~/"*) APP_DIR="$HOME/${REMOTE_DIR#"~/"}" ;;
            *) APP_DIR="$REMOTE_DIR" ;;
          esac
          mkdir -p "$APP_DIR"
          echo "==> Target: $APP_DIR (user: $(id -un))"
          echo "==> Node: $(node -v 2>/dev/null || echo 'NOT FOUND — install Node.js 20+ on MilesWeb')"
          command -v npm >/dev/null || { echo "npm not found — aborting."; exit 1; }

          TARBALL="$HOME/calibiai-build.tgz"
          [ -f "$TARBALL" ] || { echo "Uploaded tarball not found at $TARBALL"; exit 1; }

          # 1) Extract to a staging dir, then swap the build in atomically.
          echo "==> Extracting build"
          STAGE="$(mktemp -d)"
          tar xzf "$TARBALL" -C "$STAGE"
          rm -f "$TARBALL"
          if [ -d "$APP_DIR/.output" ]; then mv "$APP_DIR/.output" "$APP_DIR/.output.old"; fi
          mv "$STAGE/.output" "$APP_DIR/.output"
          cp "$STAGE/package.json" "$STAGE/package-lock.json" "$STAGE/ecosystem.config.cjs" "$APP_DIR/"
          rm -rf "$STAGE"

          # 2) Production dependencies (npm ci uses the uploaded lockfile).
          echo "==> Installing production dependencies"
          cd "$APP_DIR"
          npm ci --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund

          # 3) (Re)start the app.
          if [ -n "$RESTART_CMD" ]; then
            echo "==> Running custom restart command: $RESTART_CMD"
            bash -c "$RESTART_CMD"
          elif command -v pm2 >/dev/null 2>&1; then
            echo "==> Starting/restarting app with PM2"
            if pm2 describe calibiai >/dev/null 2>&1; then
              pm2 restart calibiai --update-env
            else
              pm2 start ecosystem.config.cjs
            fi
            pm2 save
            pm2 ls
          else
            echo "::warning::PM2 not installed on the server — the build is in place, but the app was NOT started."
            echo "Run scripts/setup-milesweb.sh once (see DEPLOY.md), or start manually: pm2 start $APP_DIR/ecosystem.config.cjs"
            exit 0
          fi

          # 4) Health check (soft — cPanel's Node.js manager may use its own port).
          sleep 3
          if curl -sf -o /dev/null --max-time 10 "http://127.0.0.1:${APP_PORT}/"; then
            echo "==> Health check passed on port $APP_PORT"
          else
            echo "::warning::Health check on http://127.0.0.1:${APP_PORT}/ failed."
            echo "The app may be running on a different port (check cPanel → Node.js, or set the APP_PORT variable). Current PM2 status:"
            pm2 ls || true
          fi

          # 5) Remove the previous build now that the new one is live.
          rm -rf "$APP_DIR/.output.old"
          echo "==> Deploy complete."
          REMOTE

      - name: Run remote deployment
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          APP_PORT: ${{ env.APP_PORT }}
          RESTART_CMD: ${{ vars.RESTART_CMD || '' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30"
          ARGS="bash -s -- '$REMOTE_DIR' '$APP_PORT' '$RESTART_CMD'"
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > deploy_key
            chmod 600 deploy_key
            cat deploy-remote.sh | ssh $SSH_OPTS -i deploy_key "$SSH_USER@$SSH_HOST" "$ARGS"
          else
            export SSHPASS="$SSH_PASSWORD"
            cat deploy-remote.sh | sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "$ARGS"
          fi
          rm -f deploy_key
